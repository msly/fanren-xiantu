<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#05070a;color:#e8e2cf;font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC","Hiragino Sans GB",sans-serif;user-select:none;-webkit-user-select:none}
canvas{display:block;position:fixed;inset:0}

.bars{position:absolute;left:22px;top:18px;width:min(320px,40vw)}

.bar i,.bar b{position:absolute;left:0;top:0;bottom:0;display:block;width:0}
.bar span{position:absolute;right:6px;top:-2px;font-size:11px;color:#fff;text-shadow:0 0 3px #000}
#hpI{background:linear-gradient(90deg,#7a1414,#e2483a)}#hpL{background:#f2c9a0}
#mpI{background:linear-gradient(90deg,#173f80,#4aa6f2)}
#stb{height:5px}#stI{background:#d8c060}
#exb{height:4px;margin-top:4px}#exI{background:linear-gradient(90deg,#6a54c8,#d3aaff)}
#gab{height:6px}#gaI{background:linear-gradient(90deg,#b07a10,#ffe27a)}
.small{font-size:12px;color:#cfc6a8;margin-top:6px;text-shadow:0 0 3px #000}
#skills{position:absolute;right:22px;bottom:22px;display:flex;gap:9px;align-items:flex-end}

.sk .k{position:absolute;left:4px;top:2px;font-size:11px;color:#f2d98e}
.sk .n{position:absolute;right:4px;bottom:2px;font-size:11px;color:#9fd0ff}

.sk.lock{opacity:.28}.sk.nomp{color:#7b8a99;border-color:#456}
.sk.ready{box-shadow:0 0 12px rgba(255,220,120,.7)}
#wave{position:absolute;top:18px;left:50%;transform:translateX(-50%);font-size:18px;letter-spacing:4px;color:#f2d98e;text-shadow:0 0 6px #000,0 0 2px #000}
#boss{position:absolute;left:50%;top:54px;transform:translateX(-50%);width:min(520px,40vw);display:none;text-align:center}
#bossName{font-size:24px;letter-spacing:8px;color:#f6e2b0;text-shadow:0 0 8px #000,0 0 3px #000,0 0 2px #000}
#bossTitle{font-size:12px;color:#e0d0a8;letter-spacing:3px;margin-top:2px;text-shadow:0 0 4px #000,0 0 2px #000}
#bhb{height:13px}#bhI{background:linear-gradient(90deg,#6a0f12,#d63b2c)}#bhL{background:#f2c9a0}
#bpb{height:5px;width:70%;margin:5px auto 0}#bpI{background:linear-gradient(90deg,#c08a10,#ffe27a);left:50%!important;transform:translateX(-50%)}
#log{position:absolute;left:22px;bottom:22px;font-size:13px;line-height:1.7;max-width:42vw;text-shadow:0 0 4px #000}
#log div{transition:opacity .6s}
#hint{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);font-size:11px;color:rgba(230,220,190,.6);text-shadow:0 0 3px #000;white-space:nowrap}
#screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:5;overflow:auto}
.panel{background:rgba(8,10,14,.86);border:1px solid rgba(242,217,142,.28);padding:28px 32px;border-radius:4px;box-shadow:0 0 60px rgba(0,0,0,.7);max-width:92vw}
.btn{pointer-events:auto;cursor:pointer;background:linear-gradient(180deg,rgba(60,48,24,.9),rgba(28,22,12,.9));border:1px solid rgba(242,217,142,.6);color:#f6e2b0;padding:10px 26px;font-size:16px;letter-spacing:4px;margin:6px;border-radius:3px;font-family:inherit;transition:all .15s}
.btn:hover{background:linear-gradient(180deg,rgba(110,86,36,.95),rgba(50,38,18,.95));box-shadow:0 0 14px rgba(242,217,142,.4)}

.btn.sm{padding:6px 14px;font-size:13px;letter-spacing:2px}
.title{text-align:center;background:none;border:none;box-shadow:none}
.title .big{font-size:clamp(56px,10vw,110px);letter-spacing:.25em;color:#f3dfa6;text-shadow:0 0 30px rgba(255,210,120,.35),0 4px 0 #2a1d08}
.title .sub{font-size:26px;letter-spacing:1em;color:#c9b88a;margin:4px 0 18px}

.keys{display:grid;grid-template-columns:auto auto;gap:4px 18px;font-size:13px;color:#c8bfa2;margin:22px auto 0;width:max-content;text-align:left;background:rgba(0,0,0,.4);padding:12px 18px;border:1px solid rgba(242,217,142,.15)}

.note{margin-top:16px;font-size:12px;color:#7d7560}
.hub{display:flex;gap:18px;width:min(1100px,94vw);height:min(680px,90vh)}
.hubL{width:330px;flex-shrink:0;overflow:auto}
.hubR{flex:1;display:flex;flex-direction:column;overflow:hidden}
.h1{font-size:30px;letter-spacing:8px;color:#f3dfa6}
.rb{font-size:34px;color:#ffe9a8;letter-spacing:4px;margin:10px 0 2px;text-shadow:0 0 14px rgba(255,200,90,.35)}
.st{font-size:14px;line-height:1.9;color:#d6cdb0}
.st em{font-style:normal;color:#f2d98e}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{pointer-events:auto;cursor:pointer;padding:8px 20px;border:1px solid rgba(242,217,142,.3);color:#cfc19a;letter-spacing:4px;background:rgba(0,0,0,.3)}
.tab.on{background:rgba(242,217,142,.15);color:#ffe9a8;border-color:rgba(242,217,142,.7)}
.list{overflow:auto;flex:1;padding-right:6px}
.card{border:1px solid rgba(242,217,142,.2);background:rgba(255,255,255,.03);padding:12px 14px;margin-bottom:10px;display:flex;gap:14px;align-items:center}
.card .ct{flex:1}
.card h3{font-size:19px;color:#f3dfa6;letter-spacing:2px;font-weight:normal}
.card p{font-size:13px;color:#b9b096;line-height:1.6;margin-top:3px}
.card .tagx{font-size:12px;color:#8fc9a8;margin-top:3px}
.card.lk{opacity:.42}
.bt{border:1px solid rgba(255,200,120,.5);padding:12px;margin-top:12px;background:rgba(255,190,90,.06)}
.prog{height:8px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.12);margin:6px 0}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#6a54c8,#d3aaff)}
#flashTxt{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);font-size:clamp(40px,7vw,84px);letter-spacing:.3em;color:#ffe9a8;text-shadow:0 0 30px rgba(255,200,90,.9),0 0 4px #000;pointer-events:none;z-index:9;opacity:0;white-space:nowrap}
#flashTxt.go{animation:ft 2.6s ease-out forwards}
@keyframes ft{0%{opacity:0;transform:translate(-50%,-50%) scale(1.6);filter:blur(8px)}15%{opacity:1;transform:translate(-50%,-50%) scale(1);filter:blur(0)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-56%) scale(1)}}
.story{max-width:620px;font-size:16px;line-height:2;color:#d9cfb0;letter-spacing:1px;text-align:left;margin:14px auto}
.res{font-size:15px;line-height:2;color:#d9cfb0}
.res em{font-style:normal;color:#ffe08a}
@media (max-width:760px){.hub{flex-direction:column;height:auto}.hubL{width:auto}.sk{width:50px;height:50px;font-size:11px}}

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('c'),g=cv.getContext('2d');
function clamp(v,a,b){return v<a?a:v>b?b:v}
function rand(a,b){return a+Math.random()*(b-a)}
function lerp(a,b,t){return a+(b-a)*t}
function angDiff(a,b){let d=b-a;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return d}
function turn(a,b,k){return a+angDiff(a,b)*Math.min(1,k)}
function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
const TAU=Math.PI*2;
function fmtN(n){n=Math.round(n);if(n>=1e8)return(n/1e8).toFixed(n>=1e9?1:2).replace(/\.?0+$/,'')+'亿';if(n>=1e5)return(n/1e4).toFixed(n>=1e6?0:1).replace(/\.0$/,'')+'万';return String(n)}
let W=0,H=0,DPR=1,ZOOM=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.floor(W*DPR);cv.height=Math.floor(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';ZOOM=clamp(Math.min(W/1280,H/760)*1.25,.6,1.4)}
addEventListener('resize',resize);resize();

/* ================= 音效 ================= */
let AC=null,master=null,muted=false,NB=null;
function initAudio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.32;master.connect(AC.destination);const len=AC.sampleRate;NB=AC.createBuffer(1,len,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1}catch(e){AC=null}}
function tone(f1,f2,dur,type,vol,delay=0){if(!AC||muted)return;const t=AC.currentTime+delay,o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(gn);gn.connect(master);o.start(t);o.stop(t+dur+.02)}
function noise(dur,ft,f1,f2,vol,delay=0){if(!AC||muted)return;const t=AC.currentTime+delay,s=AC.createBufferSource(),f=AC.createBiquadFilter(),gn=AC.createGain();s.buffer=NB;f.type=ft;f.frequency.setValueAtTime(f1,t);f.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t+dur);gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(gn);gn.connect(master);s.start(t,Math.random()*.5);s.stop(t+dur+.02)}
const lastS={};
function sfx(k){if(!AC||muted)return;const now=performance.now();if(lastS[k]&&now-lastS[k]<35)return;lastS[k]=now;switch(k){
case 'swing':noise(.13,'bandpass',2400,700,.35);break;
case 'heavy':noise(.28,'bandpass',1600,300,.5);tone(220,90,.25,'sawtooth',.08);break;
case 'hit':tone(180,55,.12,'sine',.5);noise(.06,'highpass',3000,1500,.25);break;
case 'crit':tone(260,60,.16,'sine',.55);noise(.1,'bandpass',4000,1200,.35);break;
case 'fire':tone(320,110,.25,'sawtooth',.12);noise(.25,'lowpass',2000,300,.25);break;
case 'boom':noise(.4,'lowpass',900,80,.55);tone(90,40,.35,'sine',.4);break;
case 'thunder':noise(.9,'lowpass',2600,120,.7);tone(70,35,.6,'sawtooth',.18);break;
case 'perfect':tone(880,880,.5,'sine',.25);tone(1320,1320,.6,'sine',.18,.06);tone(1760,1760,.7,'sine',.1,.12);break;
case 'hurt':tone(140,50,.22,'square',.18);noise(.15,'lowpass',1200,200,.3);break;
case 'dodge':noise(.18,'highpass',1800,5000,.18);break;
case 'level':[523,659,784,1046].forEach((f,i)=>tone(f,f,.5,'triangle',.18,i*.09));break;
case 'boss':tone(55,40,2.2,'sawtooth',.22);noise(2,'lowpass',400,60,.4);break;
case 'slam':noise(.35,'lowpass',700,60,.5);tone(80,35,.3,'sine',.4);break;
case 'shoot':tone(600,300,.12,'triangle',.08);break;
case 'coin':tone(1500,1900,.06,'square',.04);break;
case 'blade':noise(.35,'bandpass',3000,800,.4);tone(900,400,.3,'sine',.12);break;
case 'bug':noise(.6,'bandpass',4500,3000,.15);break;
case 'break':tone(300,80,.5,'square',.2);noise(.5,'bandpass',2000,200,.5);break;
}}

/* ================= 境界体系 ================= */
const CNN=['一','二','三','四','五','六','七','八','九','十','十一','十二','十三'];
const SUBN=['初期','中期','后期','大圆满'];
const MAJ=[
 {n:'炼气',subs:13,item:null},{n:'筑基',subs:4,item:'筑基丹'},{n:'结丹',subs:4,item:'降尘丹'},
 {n:'元婴',subs:4,item:'九曲灵参'},{n:'化神',subs:4,item:'化神契机'},{n:'炼虚',subs:4,item:null},
 {n:'合体',subs:4,item:null},{n:'大乘',subs:4,item:null},{n:'渡劫',subs:1,item:null},
 {n:'真仙',subs:4,item:'飞升仙引'},{n:'金仙',subs:4,item:'法则碎片'},{n:'太乙',subs:4,item:'太乙道果'},{n:'大罗',subs:4,item:'法则本源'},{n:'道祖',subs:4,item:'时间道果'}];
const LV=[];MAJ.forEach((m,mi)=>{for(let s=0;s<m.subs;s++)LV.push({mi,s,first:s===0,name:m.subs===1?m.n+'期':m.n+(mi===0?CNN[s]+'层':SUBN[s])})});
function expNeed(i){return Math.floor(30*Math.pow(1.25,i))}
const ITEMDESC={'筑基丹':'炼气修士冲击筑基之瓶颈的灵丹，血色禁地灵药所炼。','降尘丹':'助筑基修士凝结金丹的宝丹。','九曲灵参':'万年灵参，可助结丹修士碎丹成婴。','化神契机':'上古魔头分身陨灭后残留的天地感悟，可叩化神之门。','飞升仙引':'渡过九九天劫后垂落的接引仙光，凭此飞升真仙界。','法则碎片':'一缕凝而不散的法则之力，金仙需以法则入道。','太乙道果':'魔域深处孕育的道果，助金仙圆融法则、跻身太乙。','法则本源':'灰界中残存的法则本源，大罗修士借此以身化法则。','时间道果':'时间法则凝成的道果。三千大道，同一法则只容一位道祖。'};

/* ================= 存档 ================= */
const SKEY='fanren_xiantu_v1';
function newSave(){return{lv:0,exp:0,stones:0,items:{},used:{},up:{sword:0,robe:0,array:0,flask:0},chUnlock:0,green:0,best:0,cleared:{}}}
let S=newSave();
function load(){try{const s=localStorage.getItem(SKEY);if(s){const o=JSON.parse(s);S=Object.assign(newSave(),o);S.up=Object.assign(newSave().up,o.up||{});return true}}catch(e){}return false}
function save(){try{localStorage.setItem(SKEY,JSON.stringify(S))}catch(e){}}
let hasSave=load();

/* ================= 功法 ================= */
const SK=[
 {id:'fire',key:'U',alt:'1',name:'火弹术',req:0,mp:8,cd:.45,desc:'炼气期入门法术。凝聚火球射出，命中后爆裂，波及周围。'},
 {id:'blade',key:'I',alt:'2',name:'青元剑芒',req:1,mp:18,cd:2.6,desc:'以青元剑诀催动剑气，化作丈许长的剑芒，贯穿一线之敌。'},
 {id:'bug',key:'O',alt:'3',name:'噬金虫',req:2,mp:28,cd:11,desc:'放出噬金虫群，自行扑向附近敌人啃噬。此虫号称可噬万物。'},
 {id:'thunder',key:'P',alt:'4',name:'辟邪神雷',req:3,mp:40,cd:14,desc:'金雷竹蕴含的辟邪神雷，至阳至刚，专克邪魔。连降金雷，雷击可震晕敌人。'},
 {id:'avatar',key:'R',alt:'5',name:'梵圣法相',req:4,mp:0,cd:1,desc:'梵圣真魔功凝出三头六臂法相，十息之内伤害大增，现身时震荡四周。需积满法相值。太乙期后功法圆满为天煞镇狱功，法身更强。'},
 {id:'wheel',key:'T',alt:'6',name:'真言宝轮',req:9,mp:35,cd:6,desc:'真言化轮经凝出的宝轮，飞旋而出、去而复返，沿途反复绞杀。太乙期后一次祭出两轮。'},
 {id:'time',key:'G',alt:'7',name:'时间法则',req:10,mp:60,cd:22,desc:'以时间法则令光阴凝滞，敌人与其攻势尽数定住数息，期间所受伤害提高。道祖期定身更久。'}];
const PASSIVE=[
 {name:'长春功',req:0,desc:'墨大夫所传的基础功法，固本培元，法力自然回复。'},
 {name:'罗烟步',req:0,desc:'闪避身法。闪避瞬间刀枪不入；于敌招临身前一刻闪开，可触发「极限闪避」，令周遭时间流速变缓。'},
 {name:'掌天瓶',req:0,desc:'神秘小瓶，每日凝聚绿液，可催熟灵药。斩敌时收集绿液，满十滴即炼成一枚回春丹。'},
 {name:'青竹蜂云剑',req:2,desc:'以金雷竹炼制的成套飞剑，环绕周身自动出击。结丹期十八口，元婴期三十六口，化神期七十二口全数炼成。'},
 {name:'风雷翅',req:3,desc:'以雷鹏残翅炼成的飞行法宝，闪避化为雷光遁术，瞬息远遁。'},
 {name:'仙灵力',req:9,desc:'飞升后法力尽数转为仙灵力，噬金虫群数量倍增。'},
 {name:'惊蛰十二变',req:10,desc:'天鹏一族的变化神通，到仙界方得大成。雷遁所过之处雷霆炸裂，伤及沿途敌人。'},
 {name:'天煞镇狱功',req:11,desc:'梵圣真魔功的最终形态。法相化为天煞镇狱法身，伤害、持续与震荡范围大增。'},
 {name:'光阴回溯',req:13,desc:'时间道祖之能。每次出征可逆转一次致命伤，回溯至六成气血并令时间短暂凝滞。'}];

/* ================= 敌人 ================= */
const ET={
 bandit:{n:'野狼帮帮众',hp:40,atk:8,spd:115,r:15,ai:'melee',rng:46,exp:10,look:'human',c:'#6b4a2e',c2:'#a88a5a',wpn:'blade'},
 wolf:{n:'野狼',hp:30,atk:7,spd:175,r:14,ai:'lunge',exp:8,look:'beast',c:'#5a5650',c2:'#8a8478'},
 archer:{n:'野狼帮弓手',hp:28,atk:7,spd:100,r:14,ai:'ranged',exp:10,look:'human',c:'#4f3a28',c2:'#8f7a5a',wpn:'bow',proj:{spd:430,r:5,c:'#f0e0a8',n:1}},

function inArena(o,r){o.x=clamp(o.x,-HX+r,HX-r);o.y=clamp(o.y,-HY+r,HY-r)}

function stats(){const L=LV[S.lv];const m=Math.pow(1.09,S.lv)*Math.pow(1.35,L.mi);
 return{hp:Math.round(100*m*(1+.1*S.up.robe)),atk:10*m*(1+.08*S.up.sword),mp:Math.round(60+15*L.mi+2*S.lv),mpr:5+2*S.up.array+L.mi*1.5,sk:1+.06*S.up.array,pills:3+S.up.flask}}
function swordCount(){const mi=LV[S.lv].mi;return mi<2?0:mi===2?18:mi===3?36:72}
function makePlayer(){const s=stats();P={x:0,y:220,vx:0,vy:0,r:14,face:-Math.PI/2,aim:-Math.PI/2,lastMove:-Math.PI/2,state:'free',t:0,combo:0,hitSet:new Set(),slashed:false,
 hp:s.hp,maxhp:s.hp,hpLag:s.hp,atk:s.atk,mp:s.mp,maxmp:s.mp,mpr:s.mpr,sk:s.sk,st:100,stD:0,pills:s.pills,maxPills:s.pills,healT:0,inv:0,cd:{},buf:null,charge:0,gauge:0,avatar:0,anim:0,moving:false,swT:0,perf:false,ghostT:0}}
function refreshStats(heal){const s=stats();const r=P.hp/P.maxhp;P.maxhp=s.hp;P.atk=s.atk;P.maxmp=s.mp;P.mpr=s.mpr;P.sk=s.sk;P.hp=heal?s.hp:Math.max(1,r*s.hp);P.maxPills=s.pills}

/* ================= 修为 ================= */
function bottleneck(){if(S.lv>=LV.length-1)return null;const nx=LV[S.lv+1];if(nx.first&&MAJ[nx.mi].item&&S.exp>=expNeed(S.lv))return MAJ[nx.mi].item;return null}
let bnWarned=false;
function addExp(n){S.exp+=n;
 for(let guard=0;guard<60;guard++){if(S.lv>=LV.length-1){break}const need=expNeed(S.lv);if(S.exp<need)break;const nx=LV[S.lv+1];
  if(nx.first&&MAJ[nx.mi].item){S.exp=need;if(!bnWarned){bnWarned=true;msg(`修为已至${LV[S.lv].name}瓶颈！需【${MAJ[nx.mi].item}】回洞府闭关突破`,'#ffcf6a')}break}
  S.exp-=need;S.lv++;onLevel(nx)}}
function onLevel(L){if(G.state==='play'&&P){refreshStats(true);flashText(L.name);sfx('level');burst(P.x,P.y-20,40,'#ffe08a',300,3,.9);addFx({k:'ring',x:P.x,y:P.y,r0:10,r1:160,life:.6,max:.6,c:'#ffe08a',w:6})}
 if(L.first)msg(`突破至 ${MAJ[L.mi].n}期！`,'#ffe08a')}

/* ================= 工具 ================= */
function later(t,fn,src,pt){G.timers.push({t,fn,src,pt:!!pt})}
function cancelSrc(e){G.timers=G.timers.filter(t=>t.src!==e);G.teles=G.teles.filter(t=>t.src!==e);e.dashT=0;e.pullT=0}
function tele(o){const t=Object.assign({t:0,col:'#ff3020'},o);G.teles.push(t);return t}
function addFx(f){G.fx.push(f)}
function part(x,y,vx,vy,life,size,c,k,drag,grav){if(G.parts.length>1600)return;G.parts.push({x,y,vx,vy,life,max:life,size,c,k:k||'dot',drag:drag==null?3:drag,grav:grav||0})}
function sparks(x,y,a,n,c){for(let i=0;i<n;i++){const aa=a+rand(-.9,.9),sp=rand(160,480);part(x,y,Math.cos(aa)*sp,Math.sin(aa)*sp,rand(.12,.32),rand(1.5,2.6),c,'spark',7)}}
function burst(x,y,n,c,sp,size,life){for(let i=0;i<n;i++){const a=rand(0,TAU),s=rand(.2,1)*(sp||250);part(x,y,Math.cos(a)*s,Math.sin(a)*s,rand(.3,1)*(life||.6),rand(.6,1.4)*(size||3),c,'dot',3)}}
function smoke(x,y,n,c){for(let i=0;i<n;i++){const a=rand(0,TAU),s=rand(20,90);part(x,y,Math.cos(a)*s,Math.sin(a)*s-20,rand(.5,1),rand(8,18),c||'rgba(30,30,30,.5)','smoke',2)}}
function txt(x,y,s,c,size){G.texts.push({x,y,s:String(s),c,size:size||18,life:.9,max:.9,vy:-60})}
function shake(n){G.shk=Math.max(G.shk,n)}
const msgT={};function msg(s,c){const nw=performance.now();if(msgT[s]&&nw-msgT[s]<2500)return;msgT[s]=nw;const d=document.createElement('div');d.textContent=s;d.style.color=c||'#e8e2cf';const L=$('log');L.appendChild(d);while(L.children.length>6)L.removeChild(L.firstChild);setTimeout(()=>{d.style.opacity='0'},4200);setTimeout(()=>{d.remove()},5000)}
function flashText(s){const f=$('flashTxt');f.textContent=s;f.classList.remove('go');void f.offsetWidth;f.classList.add('go')}
function banner(t,sub,dur,small){G.banner={t,sub,life:dur,max:dur,small:!!small}}
function aimAt(e){return Math.atan2(P.y-e.y,P.x-e.x)}
function alive(){return G.enemies.filter(e=>!e.dead)}
function nearest(x,y,range,filter){let b=null,bd=range;for(const e of G.enemies){if(e.dead||e.state==='spawn'||(e.boss&&e.state==='intro'))continue;if(filter&&!filter(e))continue;const d=Math.hypot(e.x-x,e.y-y)-e.r;if(d<bd){bd=d;b=e}}return b}
function softAim(a,range){let best=null,bs=1e9;for(const e of G.enemies){if(e.dead||e.state==='spawn')continue;const d=Math.hypot(e.x-P.x,e.y-P.y);if(d>range+e.r)continue;const aa=Math.atan2(e.y-P.y,e.x-P.x);const df=Math.abs(angDiff(a,aa));if(df>.7)continue;const sc=d+df*200;if(sc<bs){bs=sc;best=aa}}return best==null?a:best}

/* ================= 首领招式 ================= */
function bFan(e,n,spread,spd,mul,col,r,delay){delay*=e.tempo;e.glow=delay;e.glowC=col;later(delay,()=>{const a=aimAt(e);for(let i=0;i<n;i++){const o=n>1?(i/(n-1)-.5)*spread:0;shootE(e.x,e.y-e.r*.6,a+o,spd,r,e.atk*mul,col)}sfx('shoot')},e);return delay+.45}
function bRing(e,n,spd,mul,col,delay,off){delay*=e.tempo;e.glow=delay;e.glowC=col;later(delay,()=>{const o=off==null?rand(0,TAU):off;for(let i=0;i<n;i++)shootE(e.x,e.y-e.r*.4,o+i*TAU/n,spd,8,e.atk*mul,col);sfx('shoot');addFx({k:'ring',x:e.x,y:e.y,r0:e.r,r1:e.r+80,life:.35,max:.35,c:col,w:5})},e);return delay+.5}
function bSlam(e,r,delay,mul,col){delay*=e.tempo;e.glow=delay;e.glowC=col;tele({sh:'circle',x:e.x,y:e.y,r,dur:delay,dmg:e.atk*mul,src:e,col,onEnd:t=>{addFx({k:'ring',x:t.x,y:t.y,r0:20,r1:t.r,life:.4,max:.4,c:col,w:10});smoke(t.x,t.y,14,'rgba(40,30,30,.45)');shake(10);sfx('slam')}});return delay+.55}
function bSwipe(e,rng,arc,delay,mul,col){delay*=e.tempo;const a=aimAt(e);e.face=a;e.wind=delay;tele({sh:'arc',x:e.x,y:e.y,a,r:rng,arc,dur:delay,dmg:e.atk*mul,src:e,col,onEnd:t=>{addFx({k:'slash',x:t.x,y:t.y,a:t.a,arc:t.arc,r:t.r*.9,life:.25,max:.25,c:col,w:22,sw:1});shake(6);sfx('heavy')}});return delay+.5}
function bDash(e,len,w,delay,mul,col){delay*=e.tempo;const a=aimAt(e);e.face=a;e.wind=delay;tele({sh:'line',x:e.x,y:e.y,a,len,w,dur:delay,dmg:e.atk*mul,src:e,col,onEnd:t=>{e.da=t.a;e.dashT=.18;e.dv=t.len/.18;sfx('dodge');shake(4)}});return delay+.45}
function bRain(e,cnt,r,interval,delay,mul,col){for(let i=0;i<cnt;i++){later(i*interval*e.tempo,()=>{const px=P.x+P.vx*.25+rand(-30,30),py=P.y+P.vy*.25+rand(-30,30);tele({sh:'circle',x:px,y:py,r,dur:delay*e.tempo,dmg:e.atk*mul,src:e,col,onEnd:t=>{addFx({k:'pillar',x:t.x,y:t.y,r:t.r,life:.45,max:.45,c:col});burst(t.x,t.y,10,col,220,3,.5);shake(3);sfx('slam')}})},e)}e.glow=.5;e.glowC=col;return cnt*interval*e.tempo+delay*e.tempo*.7}
function bSummon(e,type,n){e.glow=.8;e.glowC='#ffffff';later(.5,()=>{for(let i=0;i<n;i++){const a=rand(0,TAU);const m=mkEnemy(type,e.x+Math.cos(a)*90,e.y+Math.sin(a)*90,G.mult);m.exp*=.3;m.summon=true}},e);return 1.1}
function bBeams(e,n,spread,len,w,delay,mul,col){delay*=e.tempo;e.glow=delay;e.glowC=col;const a=aimAt(e);for(let i=0;i<n;i++){const o=n>1?(i/(n-1)-.5)*spread:0;tele({sh:'line',x:e.x,y:e.y,a:a+o,len,w,dur:delay,dmg:e.atk*mul,src:e,col,onEnd:t=>{addFx({k:'beam',x:t.x,y:t.y,a:t.a,len:t.len,w:t.w,life:.3,max:.3,c:col})}})}later(delay,()=>{shake(6);sfx('blade')},e);return delay+.5}
function bSpin(e,arms,steps,stepA,interval,len,w,mul,col){const a0=aimAt(e);e.glow=steps*interval*e.tempo;e.glowC=col;for(let s=0;s<steps;s++)later(s*interval*e.tempo,()=>{for(let k=0;k<arms;k++)tele({sh:'line',x:e.x,y:e.y,a:a0+k*TAU/arms+s*stepA,len,w,dur:.55*e.tempo,dmg:e.atk*mul,src:e,col,onEnd:t=>{addFx({k:'beam',x:t.x,y:t.y,a:t.a,len:t.len,w:t.w,life:.25,max:.25,c:col})}});sfx('blade')},e);return steps*interval*e.tempo+.75}
function bBlink(e,delay,r,mul,col){e.fade=.35*e.tempo;smoke(e.x,e.y,16,'rgba(60,30,90,.5)');later(.35*e.tempo,()=>{const a=rand(0,TAU);e.x=P.x+Math.cos(a)*110;e.y=P.y+Math.sin(a)*110;inArena(e,e.r);smoke(e.x,e.y,16,'rgba(60,30,90,.5)');bSlam(e,r,delay,mul,col)},e);return .35*e.tempo+delay*e.tempo+.6}
function bPull(e,dur,r,mul,col){dur*=e.tempo;e.pullT=dur;e.glow=dur;e.glowC=col;tele({sh:'circle',x:e.x,y:e.y,r,dur,dmg:e.atk*mul,src:e,col,onEnd:t=>{addFx({k:'ring',x:t.x,y:t.y,r0:10,r1:t.r+30,life:.5,max:.5,c:col,w:14});burst(t.x,t.y,40,col,400,4,.7);shake(14);sfx('boom')}});return dur+.6}

 <div class="keys"><b>WASD</b><span>移动</span><b>鼠标</b><span>瞄准（Tab 锁定目标）</span><b>左键 / J</b><span>青竹剑三段连斩</span><b>右键 / L 按住</b><span>蓄力重击，满蓄放出剑气</span><b>空格 / K</b><span>罗烟步闪避（无敌帧，踩准时机触发极限闪避）</span><b>U I O P R T G</b><span>火弹术 · 青元剑芒 · 噬金虫 · 辟邪神雷 · 梵圣法相 · 真言宝轮 · 时间法则</span><b>E</b><span>服用回春丹</span><b>Esc / M</b><span>暂停 / 静音</span></div>
 <div class="note">同人致敬作品 · 原著《凡人修仙传》（忘语）　·　进度自动保存在本浏览器</div></div>`)}
let hubTab='go';
function hub(){G.state='hub';$('hud').style.display='none';hubTab=hubTab||'go';renderHub()}
function renderHub(){const L=LV[S.lv];const st=stats();const need=expNeed(S.lv);const bn=bottleneck();const nx=LV[S.lv+1];
 const items=Object.keys(S.items).filter(k=>S.items[k]>0);
 let bt='';if(bn){const has=S.items[bn]>0;bt=`<div class="bt"><div class="kai" style="font-size:20px;color:#ffd06a">瓶颈 · ${L.name}</div><p class="st">欲破境入${MAJ[nx.mi].n}，需服用【${bn}】闭关冲击。</p>${has?`<button class="btn" data-a="break">服用${bn} · 闭关突破</button>`:`<p class="st" style="color:#ff9a7a">尚无${bn}。${hintFor(bn)}</p>`}</div>`}
 let left=`<div class="panel hubL"><div class="h1 kai">洞　府</div><div class="rb kai">${L.name}</div>
 <div class="prog"><i style="width:${S.lv>=LV.length-1?100:Math.min(100,S.exp/need*100)}%"></i></div><div class="st" style="font-size:12px">修为 ${S.lv>=LV.length-1?'圆满':fmtN(S.exp)+' / '+fmtN(need)}</div>
 <div class="st" style="margin-top:8px">气血 <em>${fmtN(st.hp)}</em>　法力 <em>${st.mp}</em><br>攻击 <em>${fmtN(st.atk)}</em>　法力回复 <em>${st.mpr.toFixed(1)}/息</em><br>回春丹 <em>${st.pills}</em> 枚　青竹蜂云剑 <em>${swordCount()}</em> 口<br>灵石 <em>${S.stones}</em>　掌天瓶绿液 <em>${S.green}/10</em>${S.best?`<br>灵界试炼最高 <em>${S.best}</em> 波`:''}</div>
 <div class="st" style="margin-top:8px">储物袋：${items.length?items.map(i=>`<em>【${i}】</em>`).join(' '):'空空如也'}</div>${bt}
 <div style="margin-top:14px"><button class="btn sm" data-a="title">返回标题</button></div></div>`;
 let right=`<div class="panel hubR"><div class="tabs"><div class="tab ${hubTab==='go'?'on':''}" data-t="go">出　征</div><div class="tab ${hubTab==='gf'?'on':''}" data-t="gf">功　法</div><div class="tab ${hubTab==='shop'?'on':''}" data-t="shop">坊　市</div><div class="tab ${hubTab==='lore'?'on':''}" data-t="lore">境　界</div></div><div class="list">`;
 if(hubTab==='go'){CH.forEach((c,i)=>{const op=chOpen(i),rok=chRealmOk(i),lk=!op||!rok;right+=`<div class="card ${lk?'lk':''}"><div class="ct"><h3 class="kai">${c.name}<span style="font-size:14px;color:#bfae88"> · ${c.sub}</span></h3><p>${!op?'尚未开启。':!rok?`需${MAJ[c.reqMi].n}期方可踏足。${c.intro}`:c.intro}</p><div class="tagx">建议境界：${c.rec}${S.cleared[i]?'　· 已通关':''}${c.endless&&S.best?'　· 最高 '+S.best+' 波':''}</div></div>${lk?'':`<button class="btn sm" data-a="go" data-i="${i}">出征</button>`}</div>`})}
 else if(hubTab==='gf'){SK.forEach(s=>{const lk=L.mi<s.req;right+=`<div class="card ${lk?'lk':''}"><div class="ct"><h3 class="kai">${s.name}　<span style="font-size:13px;color:#f2d98e">[${s.key}]</span></h3><p>${s.desc}</p><div class="tagx">${lk?'需'+MAJ[s.req].n+'期领悟':'已领悟'}${s.mp?'　· 耗法力 '+s.mp:''}　· 冷却 ${s.cd} 息</div></div></div>`});
  PASSIVE.forEach(s=>{const lk=L.mi<s.req;right+=`<div class="card ${lk?'lk':''}"><div class="ct"><h3 class="kai">${s.name}　<span style="font-size:13px;color:#8fc9a8">被动</span></h3><p>${s.desc}</p><div class="tagx">${lk?'需'+MAJ[s.req].n+'期':'已掌握'}</div></div></div>`})}
 else if(hubTab==='shop'){const U=[['sword','青竹蜂云剑 · 淬炼','以庚精、金雷竹反复淬炼本命飞剑，攻击 +8%',100],['robe','法袍 · 祭炼','以妖兽皮甲祭炼护身法袍，气血 +10%',100],['array','聚灵阵 · 布置','洞府内布下聚灵阵，法力回复 +2，法术伤害 +6%',120],['flask','丹瓶 · 扩容','炼制更大的丹瓶，回春丹上限 +1（至多 +5）',150]];
  U.forEach(([k,n,d,base])=>{const lv=S.up[k];const max=k==='flask'?5:30;const cost=Math.round(base*Math.pow(1.55,lv));right+=`<div class="card"><div class="ct"><h3 class="kai">${n}　<span style="font-size:13px;color:#f2d98e">${lv}/${max} 重</span></h3><p>${d}</p><div class="tagx">花费：${cost} 灵石</div></div><button class="btn sm" data-a="buy" data-k="${k}" data-c="${cost}" ${lv>=max||S.stones<cost?'disabled':''}>购买</button></div>`})}
 else{MAJ.forEach((m,i)=>{right+=`<div class="card ${L.mi<i?'lk':''}"><div class="ct"><h3 class="kai">${m.n}期 <span style="font-size:13px;color:#bfae88">${m.subs===13?'一至十三层':m.subs===4?'初期 · 中期 · 后期 · 大圆满':'飞升前最后一关'}</span></h3><p>${loreOf(i)}</p>${m.item?`<div class="tagx">破境所需：${m.item}</div>`:''}</div></div>`})}
 right+=`</div></div>`;
 showScreen(`<div class="hub">${left}${right}</div>`)}
function hintFor(it){return{'筑基丹':'可于「血色禁地」斩杀墨蛟后炼得。','降尘丹':'可于「燕翎堡」击败王蝉后获得。','九曲灵参':'据说藏于极阴岛秘库。','化神契机':'坠魔谷底的上古魔头分身或许是机缘所在。','飞升仙引':'需渡过「九九天劫」。','法则碎片':'北寒仙域的天庭追兵身上或有所得。','太乙道果':'孕育于魔域深处。','法则本源':'残存于灰界。','时间道果':'在天庭之主古或今手中。'}[it]||''}
function loreOf(i){return['引气入体，打通经脉。人界修士入门之境，凡人寿元，资质平庸者终生难入第十层。','以筑基丹冲破瓶颈，丹田化液，寿元二百。从此方算真正踏入仙门。','液化法力凝为金丹，寿元五百，可御使法宝，在一国之地已属一方人物。','碎丹成婴，元婴可离体遁逃，寿元千载，人界顶尖的老怪物。','元婴化神，可引天地元气为己用，人界修士的顶点，需飞升灵界方能再进。','灵界之境，炼化虚空，感悟空间法则。','元神与法体合一，举手投足皆有莫大威能。','大乘修士，灵界屈指可数的存在。','渡飞升之劫，渡过者飞升真仙界。','飞升后法力化为仙灵力，一切从头修起，如同仙界的炼气。','以法则入道，凝聚法则之力。','法则圆融，已是仙界一方巨擘。','以己身化法则，神魂与界长存。','执掌一条大道。三千大道，同一法则只容一位道祖。'][i]}
function doBreak(){const bn=bottleneck();if(!bn||!S.items[bn])return;S.items[bn]--;S.used[bn]=1;S.exp-=expNeed(S.lv);S.lv++;bnWarned=false;const L=LV[S.lv];save();sfx('thunder');sfx('level');
 flashText(`${MAJ[L.mi].n}成功`);addExp(0);renderHub();setTimeout(()=>msg(`你已是 ${L.name} 修士！${unlockText(L.mi)}`,'#ffe08a'),400)}
function unlockText(mi){return['','领悟【青元剑芒】','领悟【噬金虫】，青竹蜂云剑十八口炼成','领悟【辟邪神雷】、【风雷翅】，飞剑增至三十六口','领悟【梵圣法相】，七十二口青竹蜂云剑大成','','','','','飞升真仙界！法力化为仙灵力，领悟【真言宝轮】','领悟【时间法则】，【惊蛰十二变】大成','梵圣真魔功圆满为【天煞镇狱功】','以身化法则，神魂不灭','成就时间道祖，领悟【光阴回溯】'][mi]||''}
function pauseGame(){if(G.state!=='play')return;G.state='pause';showScreen(`<div class="panel" style="text-align:center"><div class="h1 kai">暂　停</div><div style="margin-top:16px"><button class="btn" data-a="resume">继续</button><button class="btn" data-a="retreat">遁回洞府</button></div><p class="st" style="font-size:12px;margin-top:10px">遁回洞府会放弃本章进度，已获修为与灵石保留。</p></div>`)}
function resumeGame(){G.state='play';hideScreen();last=performance.now()}
function victory(){const ch=G.ch;S.cleared[ch]=1;S.chUnlock=Math.max(S.chUnlock,Math.min(CH.length-1,ch+1));save();G.state='over';$('hud').style.display='none';const b=BS[CH[ch].boss];
 const EP={4:'魔头陨灭，坠魔谷重归死寂。你在谷底静坐七日，借化神契机感悟天地。空间节点之外，灵界的大门正徐徐开启。<br><em style="color:#ffe08a">灵界试炼已开启；修至渡劫期，可挑战九九天劫。</em>',6:'接引仙光裹住全身，天地倒转。再睁眼时，已是另一方天地——真仙界。<br><em style="color:#ffe08a">回洞府服用飞升仙引，即可飞升为真仙。</em>',10:'你立于凌霄之巅，光阴长河在脚下静静流淌。从山村少年到时间道祖，这一路九死一生，终是走到了尽头——也或许，只是另一个开始。<br><em style="color:#ffe08a">回洞府服用时间道果，成就时间道祖。全篇终。</em>'};const ep=EP[ch]?`<div class="story">${EP[ch]}</div>`:'';
 showScreen(`<div class="panel" style="text-align:center;max-width:680px"><div class="h1 kai" style="font-size:40px">斩　获</div><div class="story">${b.win}</div>${ep}
 <div class="res">本章获得修为 <em>${G.runExp}</em>　灵石 <em>${G.runSt}</em>　斩敌 <em>${G.kills}</em><br>当前境界 <em>${LV[S.lv].name}</em>${bottleneck()?`　<span style="color:#ffcf6a">（已至瓶颈）</span>`:''}${G.gotItem?`<br>获得 <em>【${G.gotItem}】</em>，回洞府闭关可破境`:''}</div>
 <div style="margin-top:18px"><button class="btn" data-a="hub">回到洞府</button></div></div>`)}
function defeat(){G.state='over';$('hud').style.display='none';save();
 showScreen(`<div class="panel" style="text-align:center"><div class="h1 kai" style="font-size:46px;color:#d8705a">身陨道消</div><div class="story" style="text-align:center">幸得一缕神魂遁回洞府，修为未失。<br>修仙之路，向来九死一生。</div>${G.endless?`<div class="res">坚持至第 <em>${G.ew}</em> 波　（最高 ${S.best} 波）</div>`:''}<div class="res">本次获得修为 <em>${G.runExp}</em>　灵石 <em>${G.runSt}</em></div>
 <div style="margin-top:16px"><button class="btn" data-a="retry">再战此地</button><button class="btn" data-a="hub">回到洞府</button></div></div>`)}
$('screen').addEventListener('click',e=>{initAudio();const tb=e.target.closest('[data-t]');if(tb){hubTab=tb.dataset.t;renderHub();return}const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a;
 if(a==='new'){if(hasSave&&!b.dataset.ok){b.dataset.ok=1;b.textContent='确定？进度将清空';return}S=newSave();save();hasSave=true;hubTab='go';showStoryThen()}
 else if(a==='cont')hub();
 else if(a==='go')startRun(+b.dataset.i);
 else if(a==='hub'){G.ground=null;hub()}
 else if(a==='retry')startRun(G.ch);
 else if(a==='break')doBreak();
 else if(a==='buy'){const k=b.dataset.k,c=+b.dataset.c;if(S.stones>=c){S.stones-=c;S.up[k]++;save();sfx('coin');renderHub()}}
 else if(a==='resume')resumeGame();
 else if(a==='retreat'){save();G.ground=null;hub()}
 else if(a==='title')title();
 else if(a==='start0')startRun(0)});
function showStoryThen(){showScreen(`<div class="panel" style="max-width:700px;text-align:center"><div class="h1 kai">序</div><div class="story">越国，镜州，青牛镇外一个小山村。<br>农家少年韩立，被三叔举荐参加七玄门的入门考验。他资质平庸、身具伪灵根，本该与仙缘无缘——直到他在山谷中，拾到一只布满奇异纹路的绿色小瓶。<br><br>修仙界，从来不缺天才。缺的是能活下去的人。</div><button class="btn" data-a="start0">入七玄门</button><button class="btn sm" data-a="hub">先去洞府看看</button></div>`)}

title();
requestAnimationFrame(frame);
window.__G=G;window.__start=startRun;window.__boss=id=>{G.enemies=[];startBoss(id)};window.__setS=o=>{Object.assign(S,o)};window.__S=()=>S;window.__P=()=>P;
})();
</script>

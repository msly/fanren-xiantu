<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('c'),g=cv.getContext('2d');
function clamp(v,a,b){return v<a?a:v>b?b:v}
function rand(a,b){return a+Math.random()*(b-a)}
function lerp(a,b,t){return a+(b-a)*t}
function angDiff(a,b){let d=b-a;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return d}
function turn(a,b,k){return a+angDiff(a,b)*Math.min(1,k)}
function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
const TAU=Math.PI*2;
function fmtN(n){n=Math.round(n);if(n>=1e8)return(n/1e8).toFixed(n>=1e9?1:2).replace(/\.?0+$/,'')+'亿';if(n>=1e5)return(n/1e4).toFixed(n>=1e6?0:1).replace(/\.0$/,'')+'万';return String(n)}
let W=0,H=0,DPR=1,ZOOM=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.floor(W*DPR);cv.height=Math.floor(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';ZOOM=clamp(Math.min(W/1280,H/760)*1.25,.6,1.4)}
addEventListener('resize',resize);resize();

/* ================= 音效 ================= */
let AC=null,master=null,muted=false,NB=null;
function initAudio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.32;master.connect(AC.destination);const len=AC.sampleRate;NB=AC.createBuffer(1,len,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1}catch(e){AC=null}}
function tone(f1,f2,dur,type,vol,delay=0){if(!AC||muted)return;const t=AC.currentTime+delay,o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(gn);gn.connect(master);o.start(t);o.stop(t+dur+.02)}
function noise(dur,ft,f1,f2,vol,delay=0){if(!AC||muted)return;const t=AC.currentTime+delay,s=AC.createBufferSource(),f=AC.createBiquadFilter(),gn=AC.createGain();s.buffer=NB;f.type=ft;f.frequency.setValueAtTime(f1,t);f.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t+dur);gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(gn);gn.connect(master);s.start(t,Math.random()*.5);s.stop(t+dur+.02)}
const lastS={};
function sfx(k){if(!AC||muted)return;const now=performance.now();if(lastS[k]&&now-lastS[k]<35)return;lastS[k]=now;switch(k){
case 'swing':noise(.13,'bandpass',2400,700,.35);break;
case 'heavy':noise(.28,'bandpass',1600,300,.5);tone(220,90,.25,'sawtooth',.08);break;
case 'hit':tone(180,55,.12,'sine',.5);noise(.06,'highpass',3000,1500,.25);break;
case 'crit':tone(260,60,.16,'sine',.55);noise(.1,'bandpass',4000,1200,.35);break;
case 'fire':tone(320,110,.25,'sawtooth',.12);noise(.25,'lowpass',2000,300,.25);break;
case 'boom':noise(.4,'lowpass',900,80,.55);tone(90,40,.35,'sine',.4);break;
case 'thunder':noise(.9,'lowpass',2600,120,.7);tone(70,35,.6,'sawtooth',.18);break;
case 'perfect':tone(880,880,.5,'sine',.25);tone(1320,1320,.6,'sine',.18,.06);tone(1760,1760,.7,'sine',.1,.12);break;
case 'hurt':tone(140,50,.22,'square',.18);noise(.15,'lowpass',1200,200,.3);break;
case 'dodge':noise(.18,'highpass',1800,5000,.18);break;
case 'level':[523,659,784,1046].forEach((f,i)=>tone(f,f,.5,'triangle',.18,i*.09));break;
case 'boss':tone(55,40,2.2,'sawtooth',.22);noise(2,'lowpass',400,60,.4);break;
case 'slam':noise(.35,'lowpass',700,60,.5);tone(80,35,.3,'sine',.4);break;
case 'shoot':tone(600,300,.12,'triangle',.08);break;
case 'coin':tone(1500,1900,.06,'square',.04);break;
case 'blade':noise(.35,'bandpass',3000,800,.4);tone(900,400,.3,'sine',.12);break;
case 'bug':noise(.6,'bandpass',4500,3000,.15);break;
case 'break':tone(300,80,.5,'square',.2);noise(.5,'bandpass',2000,200,.5);break;
}}

/* ================= 境界体系 ================= */
const CNN=['一','二','三','四','五','六','七','八','九','十','十一','十二','十三'];
const SUBN=['初期','中期','后期','大圆满'];
const MAJ=[
 {n:'炼气',subs:13,item:null},{n:'筑基',subs:4,item:'筑基丹'},{n:'结丹',subs:4,item:'降尘丹'},
 {n:'元婴',subs:4,item:'九曲灵参'},{n:'化神',subs:4,item:'化神契机'},{n:'炼虚',subs:4,item:null},
 {n:'合体',subs:4,item:null},{n:'大乘',subs:4,item:null},{n:'渡劫',subs:1,item:null},
 {n:'真仙',subs:4,item:'飞升仙引'},{n:'金仙',subs:4,item:'法则碎片'},{n:'太乙',subs:4,item:'太乙道果'},{n:'大罗',subs:4,item:'法则本源'},{n:'道祖',subs:4,item:'时间道果'}];
const LV=[];MAJ.forEach((m,mi)=>{for(let s=0;s<m.subs;s++)LV.push({mi,s,first:s===0,name:m.subs===1?m.n+'期':m.n+(mi===0?CNN[s]+'层':SUBN[s])})});
function expNeed(i){return Math.floor(30*Math.pow(1.25,i))}
const ITEMDESC={'筑基丹':'炼气修士冲击筑基之瓶颈的灵丹，血色禁地灵药所炼。','降尘丹':'助筑基修士凝结金丹的宝丹。','九曲灵参':'万年灵参，可助结丹修士碎丹成婴。','化神契机':'上古魔头分身陨灭后残留的天地感悟，可叩化神之门。','飞升仙引':'渡过九九天劫后垂落的接引仙光，凭此飞升真仙界。','法则碎片':'一缕凝而不散的法则之力，金仙需以法则入道。','太乙道果':'魔域深处孕育的道果，助金仙圆融法则、跻身太乙。','法则本源':'灰界中残存的法则本源，大罗修士借此以身化法则。','时间道果':'时间法则凝成的道果。三千大道，同一法则只容一位道祖。'};

/* ================= 存档 ================= */
const SKEY='fanren_xiantu_v1';
function newSave(){return{lv:0,exp:0,stones:0,items:{},used:{},up:{sword:0,robe:0,array:0,flask:0},chUnlock:0,green:0,best:0,cleared:{}}}
let S=newSave();
function load(){try{const s=localStorage.getItem(SKEY);if(s){const o=JSON.parse(s);S=Object.assign(newSave(),o);S.up=Object.assign(newSave().up,o.up||{});return true}}catch(e){}return false}
function save(){try{localStorage.setItem(SKEY,JSON.stringify(S))}catch(e){}}
let hasSave=load();

/* ================= 功法 ================= */
const SK=[
 {id:'fire',key:'U',alt:'1',name:'火弹术',req:0,mp:8,cd:.45,desc:'炼气期入门法术。凝聚火球射出，命中后爆裂，波及周围。'},
 {id:'blade',key:'I',alt:'2',name:'青元剑芒',req:1,mp:18,cd:2.6,desc:'以青元剑诀催动剑气，化作丈许长的剑芒，贯穿一线之敌。'},
 {id:'bug',key:'O',alt:'3',name:'噬金虫',req:2,mp:28,cd:11,desc:'放出噬金虫群，自行扑向附近敌人啃噬。此虫号称可噬万物。'},

function bPull(e,dur,r,mul,col){dur*=e.tempo;e.pullT=dur;e.glow=dur;e.glowC=col;tele({sh:'circle',x:e.x,y:e.y,r,dur,dmg:e.atk*mul,src:e,col,onEnd:t=>{addFx({k:'ring',x:t.x,y:t.y,r0:10,r1:t.r+30,life:.5,max:.5,c:col,w:14});burst(t.x,t.y,40,col,400,4,.7);shake(14);sfx('boom')}});return dur+.6}

function bSpiral(e,arms,shots,interval,spd,mul,col){const a0=rand(0,TAU);e.glow=shots*interval*e.tempo;e.glowC=col;for(let s=0;s<shots;s++)later(s*interval*e.tempo,()=>{for(let k=0;k<arms;k++)shootE(e.x,e.y-e.r*.4,a0+k*TAU/arms+s*.3,spd,7,e.atk*mul,col);sfx('shoot')},e);return shots*interval*e.tempo+.5}

function buildWorld(C){const pal=C.pal;const sc=.5,w=Math.floor((AW+600)*sc),h=Math.floor((AH+600)*sc);const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
 x.fillStyle=pal.bg;x.fillRect(0,0,w,h);
 for(let i=0;i<140;i++){const px=rand(0,w),py=rand(0,h),r=rand(30,140);const gr=x.createRadialGradient(px,py,0,px,py,r);gr.addColorStop(0,hexA(pal.bg2,.7));gr.addColorStop(1,hexA(pal.bg2,0));x.fillStyle=gr;x.fillRect(px-r,py-r,r*2,r*2)}
 for(let i=0;i<4000;i++){x.fillStyle=Math.random()<.5?pal.speck:hexA(pal.bg2,.8);x.fillRect(rand(0,w),rand(0,h),rand(1,2.5),rand(1,2.5))}
 if(pal.tiles){x.strokeStyle='rgba(0,0,0,.35)';x.lineWidth=1;for(let yy=0;yy<h;yy+=28){for(let xx=(yy/28%2)*20;xx<w;xx+=40){x.strokeRect(xx,yy,40,28)}}}
 if(pal.water){for(let i=0;i<60;i++){const px=rand(0,w),py=rand(0,h);x.strokeStyle='rgba(160,200,230,.12)';x.lineWidth=1.5;x.beginPath();x.ellipse(px,py,rand(20,60),rand(6,14),0,0,TAU);x.stroke()}
  const gr=x.createLinearGradient(0,0,0,h*.18);gr.addColorStop(0,'rgba(20,60,110,.9)');gr.addColorStop(1,'rgba(20,60,110,0)');x.fillStyle=gr;x.fillRect(0,0,w,h*.18)}
 if(pal.lava){for(let i=0;i<40;i++){let px=rand(0,w),py=rand(0,h);x.strokeStyle='rgba(255,80,20,.55)';x.lineWidth=rand(1,2.5);x.shadowColor='#ff4010';x.shadowBlur=8;x.beginPath();x.moveTo(px,py);for(let k=0;k<6;k++){px+=rand(-25,25);py+=rand(-25,25);x.lineTo(px,py)}x.stroke()}x.shadowBlur=0}
 if(C.endless){for(let i=0;i<30;i++){const px=rand(0,w),py=rand(0,h);x.strokeStyle='rgba(120,180,255,.18)';x.lineWidth=1;x.beginPath();x.arc(px,py,rand(10,30),0,TAU);x.stroke();x.beginPath();x.moveTo(px-20,py);x.lineTo(px+20,py);x.moveTo(px,py-20);x.lineTo(px,py+20);x.stroke()}}
 if(pal.deco.includes('redgrass')||pal.deco.includes('bush')){for(let i=0;i<500;i++){const px=rand(0,w),py=rand(0,h);x.strokeStyle=pal.deco.includes('redgrass')?'rgba(140,30,30,.5)':'rgba(80,120,60,.5)';x.lineWidth=1;x.beginPath();x.moveTo(px,py);x.lineTo(px-2,py-5);x.moveTo(px,py);x.lineTo(px+2,py-6);x.stroke()}}
 if(pal.deco.includes('bones')){for(let i=0;i<30;i++){const px=rand(0,w),py=rand(0,h),r=rand(10,30);x.fillStyle='rgba(90,10,10,.5)';x.beginPath();x.ellipse(px,py,r,r*.6,rand(0,3),0,TAU);x.fill()}}
 G.ground=c;
 // 立体装饰
 G.decor=[];const kinds=pal.deco;
 for(let i=0;i<70;i++){const side=Math.floor(rand(0,4));let px,py;const m=rand(-60,120);
  if(side===0){px=rand(-HX-100,HX+100);py=-HY-m}else if(side===1){px=rand(-HX-100,HX+100);py=HY+m}else if(side===2){px=-HX-m;py=rand(-HY,HY)}else{px=HX+m;py=rand(-HY,HY)}
  G.decor.push({k:kinds[Math.floor(rand(0,kinds.length))],x:px,y:py,s:rand(.9,1.6),seed:Math.random()})}
 for(let i=0;i<16;i++)G.decor.push({k:kinds.includes('crack')?'rock':kinds[Math.floor(rand(0,kinds.length))]==='tree'?'rock':kinds[Math.floor(rand(0,kinds.length))],x:rand(-HX+150,HX-150),y:rand(-HY+150,HY-150),s:rand(.6,1),seed:Math.random()});
 G.decor=G.decor.filter(d=>!(Math.abs(d.x)<200&&Math.abs(d.y-200)<200)&&d.k!=='crack'&&d.k!=='redgrass');
 G.fog=[];for(let i=0;i<14;i++)G.fog.push({x:rand(-HX,HX),y:rand(-HY,HY),r:rand(200,420),vx:rand(8,22)});
 G.pal=pal}

function doBreak(){const bn=bottleneck();if(!bn||!S.items[bn])return;S.items[bn]--;S.used[bn]=1;S.exp-=expNeed(S.lv);S.lv++;bnWarned=false;const L=LV[S.lv];save();sfx('thunder');sfx('level');
 flashText(`${MAJ[L.mi].n}成功`);addExp(0);renderHub();setTimeout(()=>msg(`你已是 ${L.name} 修士！${unlockText(L.mi)}`,'#ffe08a'),400)}
function unlockText(mi){return['','领悟【青元剑芒】','领悟【噬金虫】，青竹蜂云剑十八口炼成','领悟【辟邪神雷】、【风雷翅】，飞剑增至三十六口','领悟【梵圣法相】，七十二口青竹蜂云剑大成','','','','','飞升真仙界！法力化为仙灵力，领悟【真言宝轮】','领悟【时间法则】，【惊蛰十二变】大成','梵圣真魔功圆满为【天煞镇狱功】','以身化法则，神魂不灭','成就时间道祖，领悟【光阴回溯】'][mi]||''}
function pauseGame(){if(G.state!=='play')return;G.state='pause';showScreen(`<div class="panel" style="text-align:center"><div class="h1 kai">暂　停</div><div style="margin-top:16px"><button class="btn" data-a="resume">继续</button><button class="btn" data-a="retreat">遁回洞府</button></div><p class="st" style="font-size:12px;margin-top:10px">遁回洞府会放弃本章进度，已获修为与灵石保留。</p></div>`)}
function resumeGame(){G.state='play';hideScreen();last=performance.now()}
function victory(){const ch=G.ch;S.cleared[ch]=1;S.chUnlock=Math.max(S.chUnlock,Math.min(CH.length-1,ch+1));save();G.state='over';$('hud').style.display='none';const b=BS[CH[ch].boss];
 const EP={4:'魔头陨灭，坠魔谷重归死寂。你在谷底静坐七日，借化神契机感悟天地。空间节点之外，灵界的大门正徐徐开启。<br><em style="color:#ffe08a">灵界试炼已开启；修至渡劫期，可挑战九九天劫。</em>',6:'接引仙光裹住全身，天地倒转。再睁眼时，已是另一方天地——真仙界。<br><em style="color:#ffe08a">回洞府服用飞升仙引，即可飞升为真仙。</em>',10:'你立于凌霄之巅，光阴长河在脚下静静流淌。从山村少年到时间道祖，这一路九死一生，终是走到了尽头——也或许，只是另一个开始。<br><em style="color:#ffe08a">回洞府服用时间道果，成就时间道祖。全篇终。</em>'};const ep=EP[ch]?`<div class="story">${EP[ch]}</div>`:'';
 showScreen(`<div class="panel" style="text-align:center;max-width:680px"><div class="h1 kai" style="font-size:40px">斩　获</div><div class="story">${b.win}</div>${ep}
 <div class="res">本章获得修为 <em>${G.runExp}</em>　灵石 <em>${G.runSt}</em>　斩敌 <em>${G.kills}</em><br>当前境界 <em>${LV[S.lv].name}</em>${bottleneck()?`　<span style="color:#ffcf6a">（已至瓶颈）</span>`:''}${G.gotItem?`<br>获得 <em>【${G.gotItem}】</em>，回洞府闭关可破境`:''}</div>
 <div style="margin-top:18px"><button class="btn" data-a="hub">回到洞府</button></div></div>`)}
function defeat(){G.state='over';$('hud').style.display='none';save();
 showScreen(`<div class="panel" style="text-align:center"><div class="h1 kai" style="font-size:46px;color:#d8705a">身陨道消</div><div class="story" style="text-align:center">幸得一缕神魂遁回洞府，修为未失。<br>修仙之路，向来九死一生。</div>${G.endless?`<div class="res">坚持至第 <em>${G.ew}</em> 波　（最高 ${S.best} 波）</div>`:''}<div class="res">本次获得修为 <em>${G.runExp}</em>　灵石 <em>${G.runSt}</em></div>
 <div style="margin-top:16px"><button class="btn" data-a="retry">再战此地</button><button class="btn" data-a="hub">回到洞府</button></div></div>`)}
$('screen').addEventListener('click',e=>{initAudio();const tb=e.target.closest('[data-t]');if(tb){hubTab=tb.dataset.t;renderHub();return}const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a;if(galleryAction(a,b.dataset.id))return;
 if(a==='new'){if(hasSave&&!b.dataset.ok){b.dataset.ok=1;b.textContent='确定？进度将清空';return}S=newSave();save();hasSave=true;hubTab='go';showStoryThen()}
 else if(a==='cont')hub();
 else if(a==='go')startRun(+b.dataset.i);
 else if(a==='hub'){G.ground=null;hub()}
 else if(a==='retry')startRun(G.ch);
 else if(a==='break')doBreak();
 else if(a==='buy'){const k=b.dataset.k,c=+b.dataset.c;if(S.stones>=c){S.stones-=c;S.up[k]++;save();sfx('coin');renderHub()}}
 else if(a==='resume')resumeGame();
 else if(a==='retreat'){save();G.ground=null;hub()}
 else if(a==='title')title();
 else if(a==='start0')startRun(0)});
function showStoryThen(){showScreen(`<div class="panel" style="max-width:700px;text-align:center"><div class="h1 kai">序</div><div class="story">越国，镜州，青牛镇外一个小山村。<br>农家少年韩立，被三叔举荐参加七玄门的入门考验。他资质平庸、身具伪灵根，本该与仙缘无缘——直到他在山谷中，拾到一只布满奇异纹路的绿色小瓶。<br><br>修仙界，从来不缺天才。缺的是能活下去的人。</div><button class="btn" data-a="start0">入七玄门</button><button class="btn sm" data-a="hub">先去洞府看看</button></div>`)}

/* A read-only character viewer; it never creates enemies or touches the save. */
const PORTRAIT_LORE={
 hanli:['青竹剑修','一袭青衫，一柄长剑，一只不为人知的掌天瓶。从山村少年开始，独自走过这条漫长仙途。'],
 mo:['神手谷 · 墨居仁','灰发长须，木杖藏机。传授长春功的医者，亦有不肯向天命低头的执念。'],
 wangchan:['鬼灵门 · 少主','赤黑衣袍、血玉冠饰，血灵大法凝于杖端。锋芒外露，杀意未敛。'],
 jiyin:['乱星海 · 元婴修士','白发垂肩，玄袍绣紫，手中魂幡招引幽冥。极阴岛的漫漫长夜，自有其主。'],
 guhuojin:['天庭之主 · 时间道祖','银发金冠，玄蓝重袍。掌时间法则，立于光阴长河之上。'],
 wolf:['山野妖兽','尖耳、长吻、弓背与利爪。追逐猎物时，四肢交替踏地，獠牙映出寒光。'],
 bear:['铁背妖兽','厚重肩背覆着铁色硬毛，巨掌藏爪；一步踏下，山石震动。'],
 shark:['乱星海妖兽','背鳍如刃，鳃裂清晰，利齿隐于吻下；水中掠食者自有流线身形。'],
 mojiao:['血色禁地 · 二级妖兽','墨色鳞甲盘绕长躯，角须随息而动。守候筑基灵药的禁地凶兽。'],
 golem:['坠魔谷 · 魔傀儡','岩甲覆住关节，胸中符核驱动沉重四肢。裂隙间的赤光，是它仍在行动的痕迹。'],
 gumo:['上古魔头 · 分身','双角、胸甲与利爪凝成庞然魔躯，封印下的凶焰在肌理间游走。']
};
const PORTRAIT_GROUPS=[['cultivators','修士'],['beasts','妖兽'],['spirits','魔灵']];
const portraitGroup=t=>t.look==='human'?'cultivators':['beast','snake','jiao','spider','crab'].includes(t.look)?'beasts':'spirits';
const PORTRAITS=[{id:'hanli',name:'韩立',group:'cultivators',hero:true},
 ...Object.entries(BS).map(([id,t])=>({id,name:t.n,group:portraitGroup(t),boss:true,def:t})),
 ...Object.entries(ET).map(([id,t])=>({id,name:t.n,group:portraitGroup(t),def:t}))];
const portrait={id:'hanli',group:'cultivators',pose:'idle',face:.35,time:0,returnTo:'title',rect:null};
function gallery(){portrait.returnTo=G.state==='hub'?'hub':'title';G.state='gallery';$('hud').style.display='none';portrait.time=0;portrait.rect=null;renderGalleryUI()}
function closeGallery(){portrait.rect=null;if(portrait.returnTo==='hub')hub();else title()}
function renderGalleryUI(){
 const item=PORTRAITS.find(v=>v.id===portrait.id)||PORTRAITS[0];const def=item.def;
 const lore=PORTRAIT_LORE[item.id]||[def?.t||({human:'仙途修士',beast:'山海妖兽',snake:'鳞族妖兽',jiao:'蛟族妖兽',ghost:'幽冥灵体',golem:'异界傀儡',gumo:'魔域异相',cloud:'九天劫云',spider:'血色禁地',crab:'乱星海'}[def?.look]||'仙途中人'),
  def?.look==='human'?'衣冠、甲胄与法器，各自映出不同的出身。行走人界、灵界与仙界，总有故人与宿敌相逢。':'山海有灵，形貌各异。看清轮廓，也看清它出手前的动作。'];
 const entries=PORTRAITS.filter(v=>v.group===portrait.group);
 showScreen(`<section class="gallery" aria-label="人物志">
  <header class="gallery-head"><div><div class="gallery-eyebrow">XIANTU · CHARACTERS</div><h1 class="kai">人 物 志</h1></div><button class="btn sm" data-a="galleryBack">返回${portrait.returnTo==='hub'?'洞府':'标题'}</button></header>
  <div class="gallery-stage" id="portraitStage" aria-label="${item.name}动态形象"><span class="gallery-seal kai">${item.hero?'韩':item.boss?'尊':'灵'}</span><div class="gallery-stage-caption"><span>${item.hero?'青衫问道':item.boss?'一方之主':'众生万象'}</span><small>形随意动 · 气韵自生</small></div></div>
  <aside class="gallery-info"><div class="gallery-eyebrow">${lore[0]}</div><h2 class="kai">${item.name}</h2><p>${lore[1]}</p><div class="gallery-rule"></div>
   <div class="gallery-label">观其形</div><div class="gallery-controls" aria-label="动作预览">${[['idle','静立'],['walk','行走'],['attack','出招']].map(([key,name])=>`<button class="gallery-chip ${portrait.pose===key?'on':''}" data-a="galleryPose" data-id="${key}" aria-pressed="${portrait.pose===key}">${name}</button>`).join('')}<button class="gallery-chip" data-a="galleryTurn">转身 ↻</button></div>
   <div class="gallery-label">寻其踪</div><div class="gallery-controls" aria-label="人物分类">${PORTRAIT_GROUPS.map(([key,name])=>`<button class="gallery-chip ${portrait.group===key?'on':''}" data-a="galleryGroup" data-id="${key}" aria-pressed="${portrait.group===key}">${name}</button>`).join('')}</div>
   <div class="gallery-roster">${entries.map((v,i)=>`<button class="gallery-entry ${v.id===item.id?'on':''}" data-a="gallerySelect" data-id="${v.id}" aria-pressed="${v.id===item.id}"><span class="gallery-entry-no">${String(i+1).padStart(2,'0')}</span><span>${v.name}</span><small>${v.hero?'主角':v.boss?'首领':'众生'}</small></button>`).join('')}</div>
  </aside><footer class="gallery-foot">凡人修仙 · 仙途<span>以凡人之躯，赴长生之约。</span></footer>
 </section>`);portrait.rect=null;
}
function galleryAction(a,id){
 if(a==='gallery'){gallery();return true}if(a==='galleryBack'){closeGallery();return true}
 if(a==='gallerySelect'){const item=PORTRAITS.find(v=>v.id===id);if(item){portrait.id=id;portrait.time=0;renderGalleryUI()}return true}
 if(a==='galleryGroup'){if(PORTRAIT_GROUPS.some(v=>v[0]===id)){portrait.group=id;portrait.id=PORTRAITS.find(v=>v.group===id).id;portrait.time=0;renderGalleryUI()}return true}
 if(a==='galleryPose'){if(['idle','walk','attack'].includes(id)){portrait.pose=id;portrait.time=0;renderGalleryUI()}return true}
 if(a==='galleryTurn'){portrait.face+=Math.PI/2;return true}return false;
}
addEventListener('resize',()=>portrait.rect=null);
addEventListener('scroll',()=>portrait.rect=null,true);
function drawGallery(dt){
 const el=$('portraitStage');if(!el)return;const r=portrait.rect||(portrait.rect=el.getBoundingClientRect());if(r.width<1||r.height<1)return;
 portrait.time+=dt||0;const item=PORTRAITS.find(v=>v.id===portrait.id)||PORTRAITS[0],d=item.def,t=portrait.time;
 const cx=r.left+r.width*.5,cy=r.top+r.height*.78;
 g.save();g.beginPath();g.rect(r.left,r.top,r.width,r.height);g.clip();
 const bg=g.createLinearGradient(r.left,r.top,r.left+r.width,r.top+r.height);bg.addColorStop(0,'#122429');bg.addColorStop(1,'#081319');g.fillStyle=bg;g.fillRect(r.left,r.top,r.width,r.height);
 const light=g.createRadialGradient(cx,cy-r.height*.4,4,cx,cy-r.height*.3,r.height*.65);light.addColorStop(0,'rgba(122,168,149,.18)');light.addColorStop(1,'rgba(63,115,100,0)');g.fillStyle=light;g.fillRect(r.left,r.top,r.width,r.height);
 g.strokeStyle='rgba(171,185,154,.14)';g.lineWidth=1;
 for(let i=0;i<3;i++){g.beginPath();g.ellipse(cx,cy+4,r.width*(.2+i*.07),12+i*9,0,0,TAU);g.stroke()}
 g.strokeStyle='rgba(192,178,133,.2)';g.beginPath();g.moveTo(r.left+25,r.top+35);g.lineTo(r.left+25,r.top+80);g.moveTo(r.right-25,r.bottom-35);g.lineTo(r.right-25,r.bottom-80);g.stroke();
 let artH=item.hero?74:d.look==='human'?76*(d.big||1):d.look==='gumo'?80*d.r/18:d.look==='golem'?72:d.look==='cloud'?90:d.look==='ghost'?60*(d.big||1):64*(d.big||1);
 let artW=item.hero?94:d.look==='human'?100*(d.big||1):d.look==='gumo'?78*d.r/18:d.look==='jiao'?360:d.look==='snake'?190:100*(d.big||1);
 const sc=Math.min((r.height-115)/artH,(r.width-55)/artW,5.4);
 g.translate(cx,cy);g.scale(sc,sc);shadow(0,0,item.hero?14:d.r);
 const moving=portrait.pose==='walk',phase=(t%1.35)/1.35,active=portrait.pose==='attack';
 if(item.hero){const wa=active?portrait.face-1.4+2.8*(1-Math.pow(1-Math.min(1,phase*2),3)):portrait.face;
  drawHuman(0,0,{id:'hanli',hero:true,face:portrait.face,c:'#28584e',c2:'#b7c59b',wpn:'sword',t,moving,wa,state:active?'atk':'free'});
 }else{
  const e={id:item.boss?item.id:undefined,type:item.id,t:d,x:0,y:0,r:d.r,face:portrait.face,anim:t,moving,state:active?(phase<.55?'wind':'rec'):'chase',glow:0,wind:active&&phase<.55?1:0,trail:[]};
  if(d.look==='snake'||d.look==='jiao'){const radius=d.look==='jiao'?60:30;for(let i=0;i<90;i++){const a=portrait.face+Math.PI+i*.035;e.trail.push({x:Math.cos(a)*radius*(i/30),y:Math.sin(a)*radius*(i/70)})}}
  if(item.boss){g.save();g.globalAlpha*=.22;const halo=g.createRadialGradient(0,-artH*.45,2,0,-artH*.45,artH*.7);halo.addColorStop(0,d.aura||'#a3c7b8');halo.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=halo;g.fillRect(-artH,-artH*1.4,artH*2,artH*2);g.restore()}
  switch(d.look){
   case 'human':drawHuman(0,0,{id:item.id,state:e.state,face:e.face,c:d.c,c2:d.c2,wpn:d.wpn,scale:d.big||1,t,moving,wa:weaponAngle(e),alpha:d.alpha,skin:d.skin,hair:item.id==='mo'?'#92998b':item.id==='jiyin'?'#d5d6d9':null,crown:item.boss?d.c2:null});break;
   case 'beast':drawBeast(e,d,d.big||1);break;case 'snake':drawSnake(e,d,d.big||1,false);break;case 'jiao':drawSnake(e,d,1,true);break;
   case 'golem':drawGolem(e,d,d.big||1);break;case 'gumo':drawGumo(e,d);break;case 'ghost':drawGhost(e,d,d.big||1);break;
   case 'spider':drawSpider(e,d,d.big||1);break;case 'crab':drawCrab(e,d,d.big||1);break;case 'cloud':drawCloud(e,d);break;
  }
 }
 g.restore();
}

title();
requestAnimationFrame(frame);
window.__G=G;window.__start=startRun;window.__boss=id=>{G.enemies=[];startBoss(id)};window.__setS=o=>{Object.assign(S,o)};window.__S=()=>S;window.__P=()=>P;
})();
